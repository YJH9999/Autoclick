name: Build Windows Installer and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer and checksums
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_installer.ps1
        env:
          AUTOCLICKER_DISABLE_FILE_LOG: "1"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows-Installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
